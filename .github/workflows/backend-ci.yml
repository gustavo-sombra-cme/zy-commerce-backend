name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-ci:
    name: Restore, build, and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Ecommerce.sln

      - name: Build
        run: dotnet build Ecommerce.sln --no-restore

      - name: Test
        run: dotnet test Ecommerce.sln --no-build
